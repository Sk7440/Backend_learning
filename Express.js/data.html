<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      async function postData() {
        const res = await fetch("http://localhost:5000/users", {
          method: "POST",
          body: JSON.stringify({
            users: [
              {
                name: "ali",
                email: "ali@gmail.com",
              },
              {
                name: "ahmad",
                email: "ahmad@gmail.com",
              },
            ],
          }),
          headers: {
            "Content-Type": "application/json",
          },
        });

        console.log(await res.json());
        
      }

      postData();
    </script>
  </body>
</html>
